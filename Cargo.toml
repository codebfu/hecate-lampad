[package]
name = "hecate-lampad"
description = "Hecate lampad agent (Linux, macOS, Windows)"
version = "1.0.1"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
authors = ["Gaultier HUBERT"]

[[bin]]
name = "hecate-lampad"
path = "src/main.rs"

[dependencies]
hecate-lampad-core = { git = "https://github.com/codebfu/hecate-lampad-core.git", rev = "cf31c6d533df6bb4bdb033007d72b127e048cbd8" }
hecate-protocol = { git = "https://github.com/codebfu/hecate.git", rev = "14d626dca14b08e6e65be5c6139f63beafdd9f33", package = "hecate-protocol" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
async-trait = "0.1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[build-dependencies]
hecate-lampad-core = { git = "https://github.com/codebfu/hecate-lampad-core.git", rev = "cf31c6d533df6bb4bdb033007d72b127e048cbd8" }
